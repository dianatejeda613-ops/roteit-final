<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00593a">
  <title>RotateIt · FIME UANL</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/menu.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-inicio" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></symbol>
    <symbol id="i-semana" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-clasificacion" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4"/><path d="M12 13v4M8 21h8M9 17h6"/></symbol>
    <symbol id="i-noticias" viewBox="0 0 24 24"><rect x="3" y="4" width="15" height="16" rx="2"/><path d="M18 9h3v9a2 2 0 0 1-2 2h-1"/><path d="M7 8h7M7 12h7M7 16h4"/></symbol>
    <symbol id="i-partido" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M4.5 9c3 1 5 4 5.5 9M19.5 9c-3 1-5 4-5.5 9M12 3c0 4 2 6 9 6M12 3c0 4-2 6-9 6"/></symbol>
    <symbol id="i-equipos" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5a5 5 0 0 1 6 5"/></symbol>
    <symbol id="i-pizarra" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/><path d="M7 13l3-3 2 2 3-3"/></symbol>
    <symbol id="i-reportes" viewBox="0 0 24 24"><path d="M4 20V4M4 20h16"/><rect x="7" y="11" width="3" height="6"/><rect x="12" y="7" width="3" height="10"/><rect x="17" y="13" width="3" height="4"/></symbol>
  </svg>

  <header class="cabecera">
    <div class="marca">
      <img src="img/logo.png" alt="Logo FIME UANL" class="logo">
      <div>
        <h1>RotateIt</h1>
        <p>Facultad de Ingeniería Mecánica y Eléctrica · UANL</p>
      </div>
    </div>

    <button id="btnMenu" class="hamburguesa" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu">
      <span></span><span></span><span></span>
    </button>

    <nav id="menu" class="menu-desplegable">
      <button data-vista="inicio" class="activo"><span class="ico"><svg><use href="#i-inicio"/></svg></span><span>Inicio</span></button>
      <button data-vista="semana"><span class="ico"><svg><use href="#i-semana"/></svg></span><span>Semana</span></button>
      <button data-vista="clasificacion"><span class="ico"><svg><use href="#i-clasificacion"/></svg></span><span>Clasificación</span></button>
      <button data-vista="noticias"><span class="ico"><svg><use href="#i-noticias"/></svg></span><span>Noticias</span></button>
      <button data-vista="captura"><span class="ico"><svg><use href="#i-partido"/></svg></span><span>Partido</span></button>
      <button data-vista="equipos"><span class="ico"><svg><use href="#i-equipos"/></svg></span><span>Equipos</span></button>
      <button data-vista="pizarra"><span class="ico"><svg><use href="#i-pizarra"/></svg></span><span>Pizarra</span></button>
      <button data-vista="reportes"><span class="ico"><svg><use href="#i-reportes"/></svg></span><span>Reportes</span></button>
    </nav>
  </header>

  <main>
    <section id="inicio" class="vista activa">
      <h2>Menú principal</h2>
      <div class="menu-principal">
        <button class="tile" data-vista="semana"><span class="dona"><svg><use href="#i-semana"/></svg></span><strong>Semana</strong><small>Juegos programados</small></button>
        <button class="tile" data-vista="clasificacion"><span class="dona"><svg><use href="#i-clasificacion"/></svg></span><strong>Clasificación</strong><small>Tabla de posiciones</small></button>
        <button class="tile" data-vista="noticias"><span class="dona"><svg><use href="#i-noticias"/></svg></span><strong>Noticias</strong><small>Avisos del equipo</small></button>
        <button class="tile" data-vista="captura"><span class="dona"><svg><use href="#i-partido"/></svg></span><strong>Partido</strong><small>Captura en vivo</small></button>
        <button class="tile" data-vista="equipos"><span class="dona"><svg><use href="#i-equipos"/></svg></span><strong>Equipos</strong><small>Jugadores y posiciones</small></button>
        <button class="tile" data-vista="pizarra"><span class="dona"><svg><use href="#i-pizarra"/></svg></span><strong>Pizarra</strong><small>Táctica sobre cancha</small></button>
        <button class="tile" data-vista="reportes"><span class="dona"><svg><use href="#i-reportes"/></svg></span><strong>Reportes</strong><small>Estadísticas y CSV</small></button>
      </div>
    </section>

    <section id="semana" class="vista"></section>
    <section id="clasificacion" class="vista"></section>
    <section id="noticias" class="vista"></section>
    <section id="captura" class="vista"></section>
    <section id="equipos" class="vista"></section>

    <section id="pizarra" class="vista">
      <h2>Pizarra táctica</h2>
      <div class="barra">
        <input type="color" id="color" value="#dc2626" title="Color del trazo">
        <input type="range" id="grosor" min="1" max="12" value="4" title="Grosor">
        <button id="limpiar" class="secundario">Limpiar</button>
        <button id="guardarPizarra">Guardar PNG</button>
      </div>
      <canvas id="lienzo" width="900" height="600"></canvas>
    </section>

    <section id="reportes" class="vista"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/db.js"></script>
  <script src="js/partido.js"></script>
  <script src="js/semana.js"></script>
  <script src="js/clasificacion.js"></script>
  <script src="js/noticias.js"></script>
  <script src="js/equipos.js"></script>
  <script src="js/captura.js"></script>
  <script src="js/pizarra.js"></script>
  <script src="js/reportes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
